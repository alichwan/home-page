<script type="text/babel" src="tweaks-panel.jsx"></script>

<div id="tweaks-root"></div>

<script type="text/babel">
const { useEffect } = React;
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "font": "sans",
  "showInfobox": true,
  "showCategories": true
}/*EDITMODE-END*/;

function TweaksApp() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  useEffect(() => {
    document.body.setAttribute('data-theme', t.theme);
  }, [t.theme]);
  useEffect(() => {
    document.body.setAttribute('data-font', t.font);
  }, [t.font]);
  useEffect(() => {
    document.querySelectorAll('.infobox').forEach(el => {
      el.style.display = t.showInfobox ? '' : 'none';
    });
  }, [t.showInfobox]);
  useEffect(() => {
    document.querySelectorAll('.categories').forEach(el => {
      el.style.display = t.showCategories ? '' : 'none';
    });
  }, [t.showCategories]);

  return (
    <TweaksPanel title="Tweaks">
      <TweakSection title="Appearance">
        <TweakRadio
          label="Theme"
          value={t.theme}
          onChange={v => setTweak('theme', v)}
          options={[
            { value: 'light', label: 'Light' },
            { value: 'sepia', label: 'Sepia' },
            { value: 'dark', label: 'Dark' },
          ]}
        />
        <TweakRadio
          label="Body font"
          value={t.font}
          onChange={v => setTweak('font', v)}
          options={[
            { value: 'serif', label: 'Serif' },
            { value: 'sans', label: 'Sans' },
          ]}
        />
      </TweakSection>
      <TweakSection title="Article elements">
        <TweakToggle
          label="Show infobox"
          value={t.showInfobox}
          onChange={v => setTweak('showInfobox', v)}
        />
        <TweakToggle
          label="Show categories"
          value={t.showCategories}
          onChange={v => setTweak('showCategories', v)}
        />
      </TweakSection>
    </TweaksPanel>
  );
}

ReactDOM.createRoot(document.getElementById('tweaks-root')).render(<TweaksApp />);
</script>

</body>
